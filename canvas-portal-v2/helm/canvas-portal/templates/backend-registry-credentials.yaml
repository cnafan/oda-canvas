{{- if (.Values.rbac.registryCredentials | default dict).enabled }}
{{- $secretName := printf "%s-registry-credentials" (include "canvas-portal.backend.fullname" .) }}
{{- $labels := include "canvas-portal.backend.labels" . }}
---
# Credentials of external registries, written by the backend at runtime. This
# renders with no data on purpose: Helm's three-way merge then keeps the keys the
# backend adds. Do not add `lookup` here, as it would copy the credentials into
# Helm's release record. `helm upgrade --force` and `helm uninstall` delete the
# keys; affected registries then ask for their credentials to be re-entered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secretName }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secretName }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $secretName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "canvas-portal.backend.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
