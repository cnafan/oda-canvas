{{- /*
The portal owns this Secret's contents. Create it once and never render its data, because
Helm stores every rendered manifest in the release history. The keep policy stops Helm
deleting it on later upgrades, when it's no longer rendered. It also survives an uninstall.
*/ -}}
{{- $name := .Values.llmKeys.secretName -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
type: Opaque
{{- end }}
